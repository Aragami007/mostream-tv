name: Bug report
description: Report a reproducible problem in MoStream TV.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords or public IP addresses.
  - type: input
    id: version
    attributes:
      label: MoStream TV version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network type
      options:
        - Same LAN / Wi-Fi
        - Internet / port forwarding
        - Localhost only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error text
    validations:
      required: true
