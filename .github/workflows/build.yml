name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\MostreamTV.Host\MostreamTV.Host.csproj -c Release
      - name: Build release packages
        shell: pwsh
        run: .\scripts\Build-Release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: MostreamTV-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
          if-no-files-found: error
